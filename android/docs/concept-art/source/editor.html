<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>墨记 · 编辑事项</title>
<link rel="stylesheet" href="style.css"></head><body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg"><symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></symbol><symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M6.1 9A7 7 0 0 1 19.5 7.5"/><path d="M17.9 15A7 7 0 0 1 4.5 16.5"/></symbol><symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-8A6 6 0 0 0 6 11.5 3.2 3.2 0 0 0 7 18Z"/></symbol><symbol id="i-settings" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M19.43 12.98c.04-.32.07-.65.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></symbol><symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7 4 12l5 5"/><path d="M4 12h9a7 7 0 0 1 7 7"/></symbol><symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 7 5 5-5 5"/><path d="M20 12h-9a7 7 0 0 0-7 7"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.3" fill="currentColor" stroke="none"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5.5l3.5 2"/></symbol><symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 9a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M10.5 20a2 2 0 0 0 3 0"/></symbol><symbol id="i-clip" viewBox="0 0 24 24"><path d="M20 11.5 11 20.5a5 5 0 0 1-7-7l9.5-9.5a3.5 3.5 0 0 1 5 5l-9.5 9.5a2 2 0 0 1-3-3L15 6"/></symbol><symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L20 8l-4-4L4 16v4Z"/><path d="m14 6 4 4"/></symbol><symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/><path d="M10 11v5M14 11v5"/></symbol><symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></symbol><symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8 12 3 3 5-6"/></symbol><symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/></symbol><symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 4 4 3-3 4 4"/></symbol><symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol><symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9a4 4 0 0 1 0 6"/></symbol><symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7v.5"/><circle cx="12" cy="17" r=".8" fill="currentColor" stroke="none"/></symbol><symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3V6Z"/></symbol><symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8L3 12Z"/><circle cx="7.5" cy="8.5" r="1.3"/></symbol><symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></symbol><symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol><symbol id="i-alarm" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l2.5 1.5M5 4 3 6M19 4l2 2"/></symbol><symbol id="i-snooze" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/><path d="M5 3 3 5M19 3l2 2"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol><symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></symbol></svg>

<div class="screen">
  
  <div class="statusbar dark">
    <div>17:20</div>
    <div class="status-right">
      <svg width="15" height="11" viewBox="0 0 16 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.3" y="5" width="3" height="6" rx="1"/><rect x="8.6" y="2.7" width="3" height="8.3" rx="1"/><rect x="12.9" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="14" height="11" viewBox="0 0 24 19" fill="currentColor"><path d="M12 16.2 9.6 13.8a3.4 3.4 0 0 1 4.8 0L12 16.2Zm0-5.7c-2.3 0-4.3.9-5.8 2.4L4.5 11.2A11.4 11.4 0 0 1 12 8.3c2.9 0 5.5 1.1 7.5 2.9l-1.7 1.7a8.3 8.3 0 0 0-5.8-2.4Zm0-5.3c-3.7 0-7 1.5-9.4 3.9L1 6.8A15.6 15.6 0 0 1 12 2.4c4.4 0 8.3 1.8 11 4.4l-1.7 1.7A13.3 13.3 0 0 0 12 5.2Z"/></svg>
      <div class="battery"><i></i></div>
    </div>
  </div>
  <div class="topbar" style="height:60px">
    <div class="ibtn"><svg class="icon" viewBox="0 0 24 24"><use href="#i-back"/></svg></div>
    <div style="flex:1;margin-left:3px">
      <div class="edit-title">编辑待办</div>
      <div class="edit-sub">尚未保存</div>
    </div>
    <div class="save-text">保存修改</div>
  </div>
  <div class="edit-scroll">
    <div class="field" style="margin-bottom:12px"><div class="flabel">标题</div><div class="ftext">提交课程设计报告</div></div>
    <div class="section" style="padding:14px 16px">
      <div class="section-head" style="margin-bottom:10px">
        <div class="mini-chip on">Markdown</div>
        <div class="mini-chip">预览</div>
        <span class="chars">128 字符</span>
      </div>
      <div class="note-editor"><span class="h">## 验收清单</span>
- [x] 核心功能与页面墨迹
- [x] 导出 .mjnote 与 Markdown
- [ ] 录制 3 分钟演示视频

&gt; 演示视频控制在 3 分钟以内。</div>
    </div>
    <div class="section" style="padding:14px 16px">
      <div class="setting-row">
        <div class="icon-box" style="background:#eef1ff"><svg class="icon-sm" viewBox="0 0 24 24"><use href="#i-clock"/></svg></div>
        <div class="texts"><div class="t">2026-11-25 18:00</div><div class="s">截止时间 · 今天</div></div>
        <div class="mini-actions"><span class="gray">清除</span></div>
      </div>
      <div class="divider"></div>
      <div class="setting-row">
        <div class="icon-box" style="background:#eef1ff"><svg class="icon-sm" viewBox="0 0 24 24"><use href="#i-bell"/></svg></div>
        <div class="texts"><div class="t">提前 30 分钟提醒</div><div class="s">到期时还会再提醒一次</div></div>
        <div class="mini-actions"><span>30 分钟</span></div>
      </div>
      <div class="divider"></div>
      <div class="setting-row">
        <div class="icon-box" style="background:#eef1ff"><svg class="icon-sm" viewBox="0 0 24 24"><use href="#i-music"/></svg></div>
        <div class="texts"><div class="t">该事项铃声</div><div class="s">晨间.mp3</div></div>
        <div class="mini-actions"><span>更换</span><span class="gray">清除</span></div>
      </div>
      <div class="divider"></div>
      <div class="setting-row">
        <div class="icon-box" style="background:#eef1ff"><svg class="icon-sm" viewBox="0 0 24 24"><use href="#i-bell"/></svg></div>
        <div class="texts"><div class="t">PC 端系统通知</div><div class="s">同步到 PC 后是否在 Windows 通知中心弹出</div></div>
        <div class="switch"></div>
      </div>
    </div>
    <div class="section" style="padding:14px 16px">
      <div class="e-label">标签</div>
      <div class="tags" style="margin-top:0">
        <div class="tagchip on">#课程</div>
        <div class="tagchip on">#截止</div>
        <div class="tagchip">#实验</div>
        <div class="tagchip">#阅读</div>
      </div>
    </div>
    <div class="field-row" style="margin-top:14px">
      <div class="btn outline" style="height:44px">取消</div>
      <div class="btn primary" style="height:44px;flex:2">保存修改</div>
    </div>
  </div>
  <div class="gesture"></div>
</div>
</body></html>
