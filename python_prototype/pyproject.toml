[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moji-note"
version = "1.0.0"
description = "墨记 MoJi —— 一款带优先级链表、TUI 与 MD 风格 GUI 的跨平台电子记事本"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "刘博宇" }]
keywords = ["notes", "todo", "tui", "gui", "textual", "pyside6"]
dependencies = []

[project.optional-dependencies]
tui = ["textual>=0.80"]
gui = ["PySide6>=6.5"]
all = ["textual>=0.80", "PySide6>=6.5"]

[project.scripts]
moji = "moji.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moji = ["assets/*"]
